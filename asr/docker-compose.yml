services:
  asr:
    build: .
    container_name: tracker-asr
    restart: unless-stopped
    # Наружу не торчим: ходит только бот с этой же машины.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # tiny / base / small / medium / large-v3.
      # small — разумный компромисс для русского на CPU VPS.
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      WHISPER_LANG: ru
    volumes:
      # Кэш весов, иначе модель качается заново на каждый пересоздание контейнера.
      - asr-models:/models
    healthcheck:
      # Проверяем именно готовность модели: пока веса грузятся, сервис отвечает
      # 200 с ok=false, и healthy до этого момента ставить нельзя.
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8081/health'))['ok'] else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  asr-models:
